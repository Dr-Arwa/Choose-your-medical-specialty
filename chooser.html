<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Medical Specialty Decision Matrix</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet"/>
<style>
  input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 4px; background: #e2e8f0; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #4f46e5; cursor: pointer; }
  input[type=range].rose::-webkit-slider-thumb { background: #f43f5e; }
  input[type=range].amber::-webkit-slider-thumb { background: #f59e0b; }
  body { background: linear-gradient(135deg, #eff6ff, #eef2ff); min-height: 100vh; font-family: sans-serif; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const DEFAULT_CRITERIA = [
  { id:"passion",   label:"Passion",               arabic:"الرغبة",          desc:"How much do you enjoy this field clinically & academically?" },
  { id:"ability",   label:"Ability",                arabic:"القدرة",          desc:"Do you have the physical, social, or mental skills required?" },
  { id:"opportunity",label:"Opportunity",           arabic:"الفرصة",          desc:"Residency spots available, realistic competition for your standing?" },
  { id:"financial", label:"Financial Return",       arabic:"الجانب المادي",   desc:"Speed to stability, private practice potential?" },
  { id:"education", label:"Educational Environment",arabic:"التعليم",         desc:"Structured mentorship vs. self-taught?" },
  { id:"travel",    label:"Travel & Mobility",      arabic:"السفر",           desc:"How portable is this specialty internationally?" },
  { id:"social",    label:"Social Perception",      arabic:"نظرة المجتمع",    desc:"Does the prestige/social status matter to you?" },
  { id:"patients",  label:"Patient Demographics",   arabic:"نوع الـ Patient", desc:"Preferred patient type: children, elderly, critical, etc.?" },
  { id:"workload",  label:"Workload / Lifestyle",   arabic:"الشغل",           desc:"High-frequency flow vs. slow deep cases, on-call burden?" },
  { id:"study",     label:"Study Demand",           arabic:"المذاكرة",        desc:"Heaviness of ongoing academic load & exam difficulty?" },
];

const WEIGHT_LABELS = { 1:"Minor", 2:"Important", 3:"Non-negotiable" };
const WEIGHT_COLORS = { 1:"bg-gray-100 text-gray-600", 2:"bg-blue-100 text-blue-700", 3:"bg-red-100 text-red-600" };
const STEPS = ["Specialties","Criteria & Weights","Scores","Results"];
const BAR_COLORS = ["#facc15","#94a3b8","#d97706","#60a5fa","#a78bfa","#34d399","#f472b6","#2dd4bf","#fb923c","#38bdf8"];

const emptyScores = (cl) => Object.fromEntries(Array.from({length:20},(_,i)=>[i,Object.fromEntries(cl.map(c=>[c.id,5]))]));

function Slider({value, min, max, onChange, color="blue"}) {
  return (
    <div style={{display:"flex",alignItems:"center",gap:8}}>
      <input type="range" min={min} max={max} value={value} className={color}
        onChange={e=>onChange(+e.target.value)}
        style={{flex:1,accentColor:color==="rose"?"#f43f5e":color==="amber"?"#f59e0b":"#4f46e5"}}/>
      <span style={{width:28,textAlign:"center",fontWeight:700,fontSize:18}}>{value}</span>
    </div>
  );
}

function App() {
  const [step, setStep] = useState(0);
  const [criteria, setCriteria] = useState(DEFAULT_CRITERIA);
  const [newC, setNewC] = useState({label:"",desc:""});
  const [specs, setSpecs] = useState(["","","","","",""]);
  const [weights, setWeights] = useState(()=>Object.fromEntries(DEFAULT_CRITERIA.map(c=>[c.id,2])));
  const [scores, setScores] = useState(()=>emptyScores(DEFAULT_CRITERIA));

  const active = specs.filter(s=>s.trim()!=="");
  const totals = active.map(sp=>{
    const idx=specs.indexOf(sp);
    const total=criteria.reduce((sum,c)=>sum+weights[c.id]*(scores[idx]?.[c.id]??5),0);
    return {name:sp,total,idx};
  });
  const maxTotal = criteria.reduce((sum,c)=>sum+weights[c.id]*10,0);
  const sorted = [...totals].sort((a,b)=>b.total-a.total);

  const addCriterion = () => {
    if (!newC.label.trim()) return;
    const id = "custom_"+Date.now();
    const c = {id, label:newC.label.trim(), arabic:"", desc:newC.desc.trim()};
    setCriteria(p=>[...p,c]);
    setWeights(p=>({...p,[id]:2}));
    setScores(p=>Object.fromEntries(Object.entries(p).map(([k,v])=>[k,{...v,[id]:5}])));
    setNewC({label:"",desc:""});
  };

  const removeCriterion = (id) => {
    if (DEFAULT_CRITERIA.some(d=>d.id===id)) return;
    setCriteria(p=>p.filter(c=>c.id!==id));
    setWeights(p=>{const n={...p};delete n[id];return n;});
    setScores(p=>Object.fromEntries(Object.entries(p).map(([k,v])=>{const n={...v};delete n[id];return [k,n];})));
  };

  const reset = () => {
    setStep(0); setSpecs(["","","","","",""]); setCriteria(DEFAULT_CRITERIA);
    setWeights(Object.fromEntries(DEFAULT_CRITERIA.map(c=>[c.id,2])));
    setScores(emptyScores(DEFAULT_CRITERIA)); setNewC({label:"",desc:""});
  };

  const canProceed = step===0 ? active.length>=2 : true;

  return (
    <div style={{maxWidth:760,margin:"0 auto",padding:16}}>
      {/* Header */}
      <div style={{textAlign:"center",marginBottom:24}}>
        <h1 style={{fontSize:22,fontWeight:800,color:"#1e1b4b",margin:0}}>🩺 Medical Specialty Decision Matrix</h1>
        <p style={{color:"#6366f1",fontSize:13,marginTop:4}}>This program is created by Dr. Arwa Khaled based on Dr. Mahmoud Ghobashy's weighted scoring model <br/> نسألكم الدعاء</p>
      </div>

      {/* Stepper */}
      <div style={{display:"flex",justifyContent:"center",flexWrap:"wrap",gap:4,marginBottom:28}}>
        {STEPS.map((s,i)=>(
          <div key={s} style={{display:"flex",alignItems:"center"}}>
            <button onClick={()=>i<step&&setStep(i)}
              style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:999,border:"none",cursor:i<step?"pointer":"default",fontWeight:600,fontSize:13,
                background:step===i?"#4f46e5":i<step?"#c7d2fe":"#fff",
                color:step===i?"#fff":i<step?"#3730a3":"#94a3b8",
                boxShadow:step===i?"0 2px 8px #4f46e540":"none",transform:step===i?"scale(1.05)":"scale(1)",transition:"all 0.2s"}}>
              <span style={{width:20,height:20,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,
                background:step===i?"#fff":i<step?"#4f46e5":"#e2e8f0",
                color:step===i?"#4f46e5":i<step?"#fff":"#94a3b8"}}>
                {i<step?"✓":i+1}
              </span>{s}
            </button>
            {i<STEPS.length-1&&<div style={{width:20,height:2,background:i<step?"#818cf8":"#e2e8f0",margin:"0 2px"}}/>}
          </div>
        ))}
      </div>

      {/* Card */}
      <div style={{background:"#fff",borderRadius:20,boxShadow:"0 4px 24px #0001",padding:24}}>

        {/* STEP 0 */}
        {step===0&&(
          <div>
            <h2 style={{fontWeight:700,fontSize:17,color:"#1e293b",margin:"0 0 4px"}}>Step 1: Your Shortlist</h2>
            <p style={{color:"#64748b",fontSize:13,marginBottom:20}}>Enter 2–20 specialties you feel a baseline attraction to.</p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:10}}>
              {specs.map((sp,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{width:24,height:24,borderRadius:"50%",background:"#e0e7ff",color:"#4338ca",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{i+1}</span>
                  <input value={sp} onChange={e=>{const n=[...specs];n[i]=e.target.value;setSpecs(n);}}
                    placeholder={`Specialty ${i+1}${i<2?" (required)":" (optional)"}`}
                    style={{flex:1,border:"1px solid #e2e8f0",borderRadius:8,padding:"8px 12px",fontSize:13,outline:"none"}}
                    onFocus={e=>e.target.style.borderColor="#6366f1"} onBlur={e=>e.target.style.borderColor="#e2e8f0"}/>
                  {i>=2&&i===specs.length-1&&(
                    <button onClick={()=>setSpecs(s=>s.slice(0,-1))} style={{background:"none",border:"none",cursor:"pointer",color:"#cbd5e1",fontSize:22,lineHeight:1}}>×</button>
                  )}
                </div>
              ))}
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:12}}>
              {specs.length<20&&<button onClick={()=>setSpecs(s=>[...s,""])}
                style={{background:"none",border:"none",cursor:"pointer",color:"#4f46e5",fontWeight:600,fontSize:13}}>+ Add another specialty</button>}
              <span style={{color:"#94a3b8",fontSize:12,marginLeft:"auto"}}>{active.length} entered</span>
            </div>
            {active.length<2&&<p style={{color:"#f43f5e",fontSize:12,marginTop:8}}>⚠️ Please enter at least 2 specialties to continue.</p>}
          </div>
        )}

        {/* STEP 1 */}
        {step===1&&(
          <div>
            <h2 style={{fontWeight:700,fontSize:17,color:"#1e293b",margin:"0 0 4px"}}>Step 2: Criteria & Priorities</h2>
            <p style={{color:"#64748b",fontSize:13,marginBottom:20}}>Set the weight of each criterion, or add your own. (1 = Minor · 2 = Important · 3 = Non-negotiable)</p>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {criteria.map(c=>{
                const isDef=DEFAULT_CRITERIA.some(d=>d.id===c.id);
                const wc=weights[c.id];
                return (
                  <div key={c.id} style={{background:"#f8fafc",borderRadius:12,padding:16}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                      <div style={{flex:1}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                          <span style={{fontWeight:600,color:"#1e293b"}}>{c.label}</span>
                          {c.arabic&&<span style={{color:"#94a3b8",fontSize:12}}>{c.arabic}</span>}
                          {!isDef&&<span style={{fontSize:11,background:"#e0e7ff",color:"#4338ca",padding:"2px 6px",borderRadius:999,fontWeight:600}}>custom</span>}
                        </div>
                        {c.desc&&<p style={{color:"#64748b",fontSize:12,margin:"2px 0 0"}}>{c.desc}</p>}
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginLeft:12,flexShrink:0}}>
                        <span style={{fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:999,
                          background:wc===1?"#f1f5f9":wc===2?"#dbeafe":"#fee2e2",
                          color:wc===1?"#475569":wc===2?"#1d4ed8":"#dc2626"}}>
                          {WEIGHT_LABELS[wc]}
                        </span>
                        {!isDef&&<button onClick={()=>removeCriterion(c.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#cbd5e1",fontSize:22,lineHeight:1}}>×</button>}
                      </div>
                    </div>
                    <Slider value={wc} min={1} max={3} onChange={v=>setWeights(w=>({...w,[c.id]:v}))}
                      color={wc===3?"rose":wc===2?"blue":"amber"}/>
                  </div>
                );
              })}
            </div>
            {/* Add custom */}
            <div style={{marginTop:24,border:"2px dashed #a5b4fc",borderRadius:12,padding:16,background:"#eef2ff"}}>
              <p style={{fontWeight:600,color:"#4338ca",fontSize:14,margin:"0 0 12px"}}>➕ Add a Custom Criterion</p>
              <input value={newC.label} onChange={e=>setNewC(p=>({...p,label:e.target.value}))}
                onKeyDown={e=>e.key==="Enter"&&addCriterion()}
                placeholder="Criterion name (e.g. Research Opportunities)"
                style={{width:"100%",border:"1px solid #a5b4fc",borderRadius:8,padding:"8px 12px",fontSize:13,marginBottom:8,boxSizing:"border-box",background:"#fff",outline:"none"}}/>
              <input value={newC.desc} onChange={e=>setNewC(p=>({...p,desc:e.target.value}))}
                onKeyDown={e=>e.key==="Enter"&&addCriterion()}
                placeholder="Short description (optional)"
                style={{width:"100%",border:"1px solid #a5b4fc",borderRadius:8,padding:"8px 12px",fontSize:13,marginBottom:8,boxSizing:"border-box",background:"#fff",outline:"none"}}/>
              <button onClick={addCriterion} disabled={!newC.label.trim()}
                style={{width:"100%",padding:"9px 0",borderRadius:8,border:"none",background:"#4f46e5",color:"#fff",fontWeight:600,fontSize:13,cursor:newC.label.trim()?"pointer":"not-allowed",opacity:newC.label.trim()?1:0.4}}>
                Add Criterion
              </button>
            </div>
          </div>
        )}

        {/* STEP 2 */}
        {step===2&&(
          <div>
            <h2 style={{fontWeight:700,fontSize:17,color:"#1e293b",margin:"0 0 4px"}}>Step 3: Score Each Specialty</h2>
            <p style={{color:"#64748b",fontSize:13,marginBottom:20}}>Rate each specialty from 1–10 for every criterion based on reality.</p>
            <div style={{display:"flex",flexDirection:"column",gap:20}}>
              {active.map(sp=>{
                const ri=specs.indexOf(sp);
                return (
                  <div key={ri} style={{border:"1px solid #e0e7ff",borderRadius:12,padding:16}}>
                    <h3 style={{color:"#4338ca",fontWeight:700,fontSize:15,margin:"0 0 14px"}}>🏥 {sp}</h3>
                    <div style={{display:"flex",flexDirection:"column",gap:10}}>
                      {criteria.map(c=>{
                        const wc=weights[c.id];
                        return (
                          <div key={c.id}>
                            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                              <span style={{fontSize:13,fontWeight:500,color:"#334155"}}>{c.label}</span>
                              <span style={{fontSize:11,padding:"2px 6px",borderRadius:999,
                                background:wc===1?"#f1f5f9":wc===2?"#dbeafe":"#fee2e2",
                                color:wc===1?"#475569":wc===2?"#1d4ed8":"#dc2626"}}>×{wc}</span>
                            </div>
                            <Slider value={scores[ri]?.[c.id]??5} min={1} max={10}
                              onChange={v=>setScores(p=>({...p,[ri]:{...p[ri],[c.id]:v}}))} color="blue"/>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* STEP 3 */}
        {step===3&&(
          <div>
            <h2 style={{fontWeight:700,fontSize:17,color:"#1e293b",margin:"0 0 4px"}}>Results</h2>
            <p style={{color:"#64748b",fontSize:13,marginBottom:20}}>Maximum possible score: <strong style={{color:"#4f46e5"}}>{maxTotal} pts</strong></p>

            <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:28}}>
              {sorted.map(({name,total},rank)=>(
                <div key={name}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
                    <span style={{fontWeight:600,color:"#334155"}}>{["🥇","🥈","🥉"][rank]||"  "} {name}</span>
                    <span style={{fontWeight:700,color:"#475569"}}>{total} / {maxTotal}</span>
                  </div>
                  <div style={{background:"#f1f5f9",borderRadius:999,height:20,overflow:"hidden"}}>
                    <div style={{height:20,borderRadius:999,background:BAR_COLORS[rank%BAR_COLORS.length],width:`${(total/maxTotal)*100}%`,transition:"width 0.7s"}}/>
                  </div>
                  <p style={{color:"#94a3b8",fontSize:11,marginTop:2}}>{((total/maxTotal)*100).toFixed(1)}% match</p>
                </div>
              ))}
            </div>

            <h3 style={{fontWeight:700,color:"#475569",fontSize:12,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Detailed Breakdown</h3>
            <div style={{overflowX:"auto",borderRadius:12,border:"1px solid #e2e8f0"}}>
              <table style={{width:"100%",fontSize:12,borderCollapse:"collapse"}}>
                <thead style={{background:"#eef2ff"}}>
                  <tr>
                    <th style={{textAlign:"left",padding:"8px 12px",color:"#475569",fontWeight:600}}>Criterion</th>
                    <th style={{padding:"8px 6px",color:"#64748b"}}>Wt.</th>
                    {sorted.map(s=><th key={s.name} style={{padding:"8px 6px",color:"#4338ca",fontWeight:600,whiteSpace:"nowrap"}}>{s.name}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {criteria.map((c,ci)=>(
                    <tr key={c.id} style={{background:ci%2===0?"#fff":"#f8fafc"}}>
                      <td style={{padding:"7px 12px",fontWeight:500,color:"#334155"}}>{c.label}</td>
                      <td style={{padding:"7px 6px",textAlign:"center"}}>
                        <span style={{fontSize:11,padding:"2px 6px",borderRadius:999,fontWeight:700,
                          background:weights[c.id]===1?"#f1f5f9":weights[c.id]===2?"#dbeafe":"#fee2e2",
                          color:weights[c.id]===1?"#475569":weights[c.id]===2?"#1d4ed8":"#dc2626"}}>
                          {weights[c.id]}
                        </span>
                      </td>
                      {sorted.map(s=>{
                        const sc=scores[s.idx]?.[c.id]??5;
                        return (
                          <td key={s.name} style={{padding:"7px 6px",textAlign:"center"}}>
                            <span style={{color:"#94a3b8"}}>{sc}</span>
                            <span style={{color:"#cbd5e1",margin:"0 2px"}}>×</span>
                            <span style={{fontWeight:700,color:"#4338ca"}}>{sc*weights[c.id]}</span>
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                  <tr style={{background:"#eef2ff",fontWeight:700}}>
                    <td style={{padding:"8px 12px",color:"#334155"}} colSpan={2}>Total</td>
                    {sorted.map(s=><td key={s.name} style={{padding:"8px 6px",textAlign:"center",color:"#4338ca",fontSize:14}}>{s.total}</td>)}
                  </tr>
                </tbody>
              </table>
            </div>

            {sorted.length>=2&&Math.abs(sorted[0].total-sorted[1].total)<maxTotal*0.05&&(
              <div style={{marginTop:16,background:"#fffbeb",border:"1px solid #fcd34d",borderRadius:12,padding:16,fontSize:13,color:"#92400e"}}>
                <strong>⚠️ Tie-breaker alert!</strong> Your top two specialties are very close. Fall back to:
                <ol style={{marginLeft:20,marginTop:6}}>
                  <li><strong>Passion</strong> — which one do you genuinely love more?</li>
                  <li><strong>Ability</strong> — which suits your strengths better?</li>
                </ol>
              </div>
            )}

            <div style={{marginTop:16,background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:12,padding:16,fontSize:13,color:"#1e40af"}}>
              <strong>📋 Reality Check (don't skip this!)</strong>
              <ul style={{marginLeft:20,marginTop:6}}>
                <li>Talk to a senior in your top specialty — verify your Opportunity & Education scores.</li>
                <li>Evaluate the hospital, not just the field. Toxic environment = miserable career.</li>
                <li>Factor in your personal life: family, health, commute.</li>
              </ul>
            </div>

            <button onClick={reset} style={{marginTop:20,width:"100%",padding:"10px 0",borderRadius:12,border:"none",background:"#f1f5f9",color:"#475569",fontWeight:600,fontSize:13,cursor:"pointer"}}>
              🔄 Start Over
            </button>
          </div>
        )}

        {/* Navigation */}
        {step<3&&(
          <div style={{display:"flex",justifyContent:"space-between",marginTop:28}}>
            <button onClick={()=>setStep(s=>s-1)} disabled={step===0}
              style={{padding:"9px 20px",borderRadius:12,border:"none",background:"#f1f5f9",color:"#475569",fontWeight:600,fontSize:13,cursor:step===0?"not-allowed":"pointer",opacity:step===0?0.4:1}}>
              ← Back
            </button>
            <button onClick={()=>setStep(s=>s+1)} disabled={!canProceed}
              style={{padding:"9px 24px",borderRadius:12,border:"none",background:"#4f46e5",color:"#fff",fontWeight:600,fontSize:13,cursor:canProceed?"pointer":"not-allowed",opacity:canProceed?1:0.4,boxShadow:"0 2px 8px #4f46e540"}}>
              {step===2?"See Results →":"Next →"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
